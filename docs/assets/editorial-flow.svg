<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img" aria-labelledby="flow-title flow-desc" id="editorial-flow-root"><title id="flow-title">Editorial publishing with independent acceptance</title><desc id="flow-desc">Research and bilingual drafts pass independent editing and verification, real rendering checks and admission, then CMS publication with public readback. Rejection, quota failures and unknown outcomes stop publication. Optional syndication follows separately.</desc><defs><marker id="editorial-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#8fac9f"/></marker></defs><rect width="1200" height="530" rx="18" fill="#0b1114"/><g font-family="Arial,DejaVu Sans,sans-serif"><text x="40" y="62" fill="#f4f7f6" font-size="34" font-weight="700">Publication is an outcome, not a scheduler status.</text><text x="40" y="103" fill="#b6c5c0" font-size="21">Reviewed RU / EN content · exact-version evidence · no fabricated acceptance</text>
<g fill="none" stroke="#8fac9f" stroke-width="2" marker-end="url(#editorial-flow-arrow)"><path d="M290 205H330"/><path d="M580 205H620"/><path d="M870 205H910"/><path d="M455 260V340" stroke="#d8a6ac"/><path d="M745 260V340" stroke="#d8a6ac"/><path d="M1035 260V340" stroke-dasharray="5 5"/></g>
<g><rect x="40" y="150" width="250" height="110" rx="12" fill="#18242a" stroke="#8fa9b4"/><text x="61" y="189" fill="#f4f7f6" font-size="23" font-weight="600">01 · Research + draft</text><text x="61" y="220" fill="#bfd0c8" font-size="17">Deduplication · daily claim</text><text x="61" y="244" fill="#bfd0c8" font-size="17">One bilingual pair per day</text>
<rect x="330" y="150" width="250" height="110" rx="12" fill="#12332b" stroke="#34d399"/><text x="351" y="189" fill="#ecfaf4" font-size="23" font-weight="600">02 · Independent QA</text><text x="351" y="220" fill="#b5decf" font-size="17">Editor + fresh verifier</text><text x="351" y="244" fill="#b5decf" font-size="17">Raw plan + version hashes</text>
<rect x="620" y="150" width="250" height="110" rx="12" fill="#12252c" stroke="#69b9cc"/><text x="641" y="189" fill="#ecf8fa" font-size="23" font-weight="600">03 · Render + admit</text><text x="641" y="220" fill="#bfd0d8" font-size="17">Desktop / mobile review</text><text x="641" y="244" fill="#bfd0d8" font-size="17">Exact accepted payload</text>
<rect x="910" y="150" width="250" height="110" rx="12" fill="#25203a" stroke="#a99bd6"/><text x="931" y="189" fill="#f1edff" font-size="23" font-weight="600">04 · CMS + readback</text><text x="931" y="220" fill="#ccc4e5" font-size="17">API fields + public body</text><text x="931" y="244" fill="#ccc4e5" font-size="17">Archives + sitemap links</text>
<rect x="420" y="340" width="370" height="100" rx="12" fill="#2b1e25" stroke="#d8a6ac"/><text x="444" y="380" fill="#f9e4e7" font-size="23" font-weight="600">Reject / quota / unknown</text><text x="444" y="414" fill="#e0bdc4" font-size="18">Stop. Preserve evidence. No blind retry.</text>
<rect x="910" y="340" width="250" height="100" rx="12" fill="#232b26" stroke="#a8beb2"/><text x="931" y="379" fill="#eff5f1" font-size="21" font-weight="600">Selected syndication</text><text x="931" y="411" fill="#c4d5ca" font-size="17">Delay + per-target receipts</text></g>
<text x="40" y="494" fill="#b6c5c0" font-size="18">Workflow contract, not a readiness claim: reliable scheduled daily delivery is still under acceptance.</text></g></svg>
