<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-labelledby="arch-title arch-desc" id="architecture-root">
<title id="arch-title">24GO.SITE logical architecture</title><desc id="arch-desc">The Next.js dashboard communicates with the tenant-scoped FastAPI backend. Integrations feed the API and workers. Workers and the API persist data in PostgreSQL, with Redis supporting queues and state. This is a logical overview, not external-platform acceptance evidence.</desc>
<defs><marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#95b8ad"/></marker></defs>
<rect width="1200" height="610" rx="18" fill="#0b1114"/>
<g font-family="Arial,DejaVu Sans,sans-serif"><text x="50" y="64" fill="#f4f7f6" font-size="34" font-weight="700">One workspace. Explicit service boundaries.</text><text x="50" y="104" fill="#b6c5c0" font-size="21">Logical architecture · integrations depend on authorization and platform capabilities</text>
