# =====================================================================
#  Скилл статей - конфиг проекта 24GO
#  Собрано автопилотом 2026-10-07. Единственное место специфики проекта.
# =====================================================================

project:
  domain: "www.24go.site"
  content_path: "/blog"

audience:
  profile: >
    Владельцы малого и среднего B2B-бизнеса и маркетологи из России/СНГ
    (плюс англоязычные), которые ищут клиентов в Telegram, VK и WhatsApp.
    Уже пробовали ручной поиск или рекламу, боятся банов аккаунтов и слива
    бюджета, хотят пошаговые объяснения без жаргона и цифры вместо обещаний.
  # low = читатель ищет действие ("как найти клиентов в telegram")
  jargon_level: "low"

voice:
  # 3 живых RU-текста проекта (тон-матчинг + калибровка каденции).
  source: "./voice-samples"
  forbidden:
    - "в современном мире"
    - "не секрет, что"
    - "давайте разберём"
    - "в этой статье вы узнаете"
    - "подведём итог"
    - "это и есть"

cta:
  # Ведём на бесплатный вход: триал 3 дня + бесплатные инструменты сайта.
  offer: "Попробовать 24GO бесплатно: 3 дня триала и бесплатные инструменты лидогенерации"
  url: "https://www.24go.site/tools"

editorial:
  banned_words:
    # Гарантии результата (юр-риск + инфоцыганщина)
    - "гарантируем результат"
    - "гарантирую результат"
    - "100% результат"
    - "стопроцентный результат"
    - "обязательно заработаете"
    - "гарантированный доход"
    # Ложная срочность
    - "осталось мест"
    - "только сегодня"
    - "успей до"
    # Образовательная лексика без лицензии (ФЗ-273)
    - "курс"
    - "обучение"
    - "школа"
    - "диплом"
    # Бренд: только каноничное написание
    - "24 go"
    - "24го"

legal:
  # RU-аудитория + RU-версии статей: включён юр-модуль checklists/legal-ru.md
  region: "ru"

notify:
  channel: "chat"

research:
  youtube:
    enabled: false
    transcript_provider: ""
  # Направления слотов: поисковый вопрос / свежее изменение продукта ниши.
  daily_balance: ["search", "fresh"]
  # Ландшафт ниши против моно-темы (ядро + смежное + сравнения).
  watchlist:
    core: ["лидогенерация в telegram", "парсинг telegram-групп", "прогрев аккаунтов", "лидогенерация во vkontakte", "парсинг whatsapp", "холодные рассылки в мессенджерах"]
    adjacent: ["amoCRM интеграция", "bitrix24 интеграция", "найм через telegram", "email-верификация регистрации"]
    comparison: ["telegram против whatsapp для b2b", "vkontakte против telegram", "amoCRM против bitrix24"]
  windows_days: 14

qa:
  final_review:
    # Второй модели другого семейства нет: каскад идёт свежими субагентами
    # той же модели (слабее канона, честно фиксируем).
    editor_model: ""
    reviewer_model: ""

cms:
  # custom = наш SQL-адаптер: идемпотентный upsert в PostgreSQL blog_posts
  # по ключу (tenant_id, slug) скриптами scripts/seed-blog-*.py (UPDATE при
  # конфликте = "найти по slug, обновить или создать" по Этапу 9b).
  # tools/publish.py для этого стека не используется.
  adapter: "custom"

tools:
  originality:
    max_cosine: 0.60
    ngram_n: 5
    max_ngram: 0.30
  cadence:
    max_per_1k: 3.0
  read_aloud:
    max_sentence_words: 40
  structure:
    min_internal_links: 1

image:
  # Генератора обложек нет: Этап 6b всегда SKIP, статьи без hero-картинок.
  tool: ""
  format: "webp"
  dest: "./images"
  ratio: "16:9"
  max_kb: 200
