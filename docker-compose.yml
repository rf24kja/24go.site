services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - internal

  fastapi:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - internal
      - preyi_preyi_net

  # ── Celery Beat Scheduler ────────────────────────────────────────────
  celery-beat:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    command: celery -A app.celery_app:celery beat -l info
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - internal

  # ── Worker Pools (one per queue) ─────────────────────────────────────
  worker-parser:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    command: celery -A app.celery_app:celery worker -l info -Q parser -c 4
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - internal

  worker-poster:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    command: celery -A app.celery_app:celery worker -l info -Q poster -c 2 --prefetch-multiplier=1
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - internal

  worker-warmup:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    command: celery -A app.celery_app:celery worker -l info -Q warmup -c 2
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - internal

  worker-listener:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    command: celery -A app.celery_app:celery worker -l info -Q listener -c 1
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - internal

  worker-billing:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    command: celery -A app.celery_app:celery worker -l info -Q billing -c 1
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - internal

  # ── Web Dashboard (Next.js) ───────────────────────────────────────────
  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - internal

  # ── Telegram Mini-Bot ───────────────────────────────────────────────
  bot:
    build:
      context: ./services/bot
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - fastapi
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      API_URL: http://fastapi:8000
      OWNER_CHAT_ID: ${OWNER_CHAT_ID:-0}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - internal

networks:
  internal:
    driver: bridge
  preyi_preyi_net:
    external: true
    name: preyi-core_preyi_net

volumes:
  pgdata:
