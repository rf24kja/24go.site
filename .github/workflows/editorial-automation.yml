name: Editorial automation contracts

on:
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - 'verification/editorial-recovery/**'
      - '.github/workflows/editorial-automation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'automation/**'
      - 'verification/editorial-recovery/**'
      - '.github/workflows/editorial-automation.yml'

permissions:
  contents: read

jobs:
  offline-editorial-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Exact-patch recovery, bounded rejection and no provider retry
        run: python verification/editorial-recovery/test_patch_recovery.py
