[pytest]
asyncio_mode = auto
# ponytail: one loop for the whole session — the app's asyncpg engine pool
# binds connections to a loop; per-test/per-fixture loops die with
# "Event loop is closed" / "Future attached to a different loop".
# BOTH tests and fixtures must share it.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
